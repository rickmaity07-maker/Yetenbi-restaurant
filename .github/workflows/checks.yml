# Runs on every push and pull request. Vercel builds and deploys separately.
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
